<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MALIYA-MD Vercel Pair</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: min(92vw, 500px);
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      box-sizing: border-box;
      font-size: 16px;
    }
    input {
      margin: 14px 0;
      background: #020617;
      color: #fff;
    }
    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
      border: none;
      font-weight: 700;
    }
    .result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #020617;
      border: 1px solid #334155;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .code {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-top: 10px;
      color: #93c5fd;
    }
    .muted { color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>MALIYA-MD Pair Code</h2>
    <p class="muted">Enter WhatsApp number in international format. Example: 9477XXXXXXX</p>
    <input id="number" placeholder="9477XXXXXXX" />
    <button id="btn">Generate Pair Code</button>
    <div class="result" id="result">Ready.</div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const result = document.getElementById('result');
    const number = document.getElementById('number');

    btn.addEventListener('click', async () => {
      const value = number.value.trim();
      if (!value) {
        result.textContent = 'Please enter a number.';
        return;
      }
      result.textContent = 'Generating...';
      try {
        const res = await fetch(`/api/pair?number=${encodeURIComponent(value)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.code || data.error || 'Request failed');
        result.innerHTML = `Number: ${data.number}<div class="code">${data.code}</div><div class="muted">${data.note || ''}</div>`;
      } catch (err) {
        result.textContent = err.message || 'Failed.';
      }
    });
  </script>
</body>
</html>
